name: Build and Release app with pyinstaller
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: >
          python -m pip install --upgrade pip

          pip install -r requirements.txt

      - name: Package Application with PyInstaller
        run: |
          pyinstaller main.py --name sepreadsheet_separator_app --onedir --additional-hooks-dir=./hooks --collect-all streamlit --hidden-import "streamlit.web.cli" --add-data "streamlit_app.py;." --add-data ".streamlit/config.toml;.streamlit/" --clean --noconfirm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-files  # Must match the name in Job 1
          path: dist

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOW=$(date +'%Y-%m-%d-%H-%M')
          
          # Zip the downloaded folder
          zip -r release-$NOW.zip dist/

          # Create release and upload the zip
          gh release create "v$NOW" \
            --title "Release $NOW" \
            --generate-notes \
            ./release-$NOW.zip